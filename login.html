<input id="username" placeholder="이름 입력">
<button onclick="enter()">입장하기</button>

<script>
function enter() {
  const name = document.getElementById("username").value;

  if (!name) {
    alert("이름 입력");
    return;
  }

  localStorage.setItem("username", name);
  location.href = "index.html";
}
</script>

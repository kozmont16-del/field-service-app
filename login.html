<h2>로그인</h2>

<input id="username" placeholder="이름 입력"><br><br>

<select id="role">
  <option value="publisher">전도인</option>
  <option value="leader">인도자</option>
  <option value="group">집단관리자</option>
  <option value="admin">통합관리자</option>
</select><br><br>

<button onclick="enter()">입장하기</button>

<script>
function enter() {
  const name = document.getElementById("username").value;
  const role = document.getElementById("role").value;

  if (!name) {
    alert("이름 입력");
    return;
  }

  localStorage.setItem("username", name);
  localStorage.setItem("role", role);

  location.href = "index.html";
}
</script>

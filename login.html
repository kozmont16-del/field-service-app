<h2 id="welcome"></h2>
<button onclick="logout()">로그아웃</button>

<script>
const name = localStorage.getItem("username");

if (!name) {
  location.href = "login.html";
} else {
  document.getElementById("welcome").innerText = name + "님 환영합니다";
}

function logout() {
  localStorage.clear();
  location.href = "login.html";
}
</script>
alert("테스트");
